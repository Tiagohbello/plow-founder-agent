services:
  agent:
    build: .
    environment:
      AGENT_ID: ${AGENT_ID:-founder-agent}
      # Inherit the official image defaults for Plow inference.
    volumes:
      # plow-agents mint writes this file with restrictive permissions. The
      # image promotes it into the runtime credential path during boot.
      - ./plow-credentials:/var/lib/plow/credentials.host:ro
      # Keep sessions and runtime state between restarts.
      - agent-home:/var/lib/hermes
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "/opt/hermes/.venv/bin/python3", "/opt/founder-agent/doctor.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # No ports: the agent connects outbound to Plow Chat.

volumes:
  agent-home:
