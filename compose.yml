services:
  agent:
    build: .
    environment:
      AGENT_ID: ${AGENT_ID:?set the Agent Index id this container reports as}
      # Plow remains the messaging transport; Gemini handles inference.
      HERMES_PROVIDER: gemini
      HERMES_MODEL: gemini-3.8-flash
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in .env}
    volumes:
      # plow-agents mint writes this file with restrictive permissions. The
      # image promotes it into the runtime credential path during boot.
      - ./plow-credentials:/var/lib/plow/credentials.host:ro
      # Keep sessions and runtime state between restarts.
      - agent-home:/var/lib/hermes
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "/opt/hermes/.venv/bin/python3", "/opt/founder-agent/doctor.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # No ports: the agent connects outbound to Plow Chat.

volumes:
  agent-home:
